# FindIt AI - source dataset mapping (read by findit_ingest).
# Maps source CSV column names to canonical fields. Change only this file for another dataset.
# Required: report_type, category, description, color, location, timestamp.
# Optional (leave the value empty if the dataset has no such column):
#   source_id - when absent, "line:<n>" is used.
#   brand     - when absent or missing, brand is unknown.
#   reporter  - when absent or missing, a placeholder user "Unknown reporter (imported)" is used.

source.path = data/raw/lost_found_dataset_realistic_metadata_30k.csv

column.source_id   = item_id
column.report_type = lost_or_found
column.category    = item_name
column.description = description
column.color       = color
column.brand       = brand
column.location    = location
column.reporter    = user
column.timestamp   = timestamp

# Values of the report_type column (case-insensitive, comma-separated).
report_type.lost  = lost
report_type.found = found

# Values treated as missing (case-insensitive) in addition to empty/whitespace-only fields.
# The dataset stores an absent brand as the string "None".
missing_tokens = none, null, nan, n/a, na
