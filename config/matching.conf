# FindIt AI - matching settings (read by the findit CLI).
# score = sum(weight * component) / sum(weights); with these defaults (sum = 1):
#   score = 0.60*text + 0.20*location + 0.10*category + 0.10*colour
# The score ranks candidates relative to each other. It is NOT a probability.

# Where the text component comes from:
#   python  - TF-IDF + cosine similarity from the Python service (ml/findit_ml/service.py)
#   keyword - C++ keyword overlap (no Python needed)
# The category, colour and location components are always computed in C++.
text_engine = python

# Python service. executable and module_path are relative to the directory the program is
# started from (the project root). A relative log_file is placed inside <data-dir>/store/, so
# with the default --data-dir it is data/store/python_matcher.log; an absolute path is used as is.
python.executable      = .venv/bin/python
python.module_path     = ml
python.log_file        = python_matcher.log
python.timeout_seconds = 120
# If Python cannot start (missing venv/dependencies, crash, invalid reply), use the keyword
# baseline for the rest of the session instead of failing.
python.fallback        = true

weight.text     = 0.60
weight.location = 0.20
weight.category = 0.10
weight.colour   = 0.10

top_k     = 3
threshold = 0.0

# Only compare found reports of the same category (case-insensitive).
# With blocking on, the category component is always 1; turn it off to let related
# categories (see category_group.*) compete.
category_blocking = true

# Date filter: 0 = off. Left off because in this dataset the found date precedes the lost
# date in about half of the generated lost/found pairs (Phase 0 analysis), so a date window
# is not supported by the source data.
date_window_days = 0

# Partial credit (0.5) for related values. These groupings are design assumptions made for
# this campus, not facts taken from the dataset. Edit freely.
zone.SPORTS   = Sports Ground, Cricket Ground, Sports Complex, Gym
zone.HOSTEL   = Hostel Block A, Hostel Block B
zone.ACADEMIC = Academic Block, Classroom A102, Seminar Hall, Study Hall, Library, Auditorium, Corridor
zone.ENTRANCE = Main Gate, Bus Stop, Parking Area
zone.ADMIN    = Admin Block
zone.OUTDOOR  = Garden, Canteen

colour_group.GREYSCALE = grey, silver
colour_group.WARM      = red, pink

category_group.BAGS       = Bag, Laptop Bag
category_group.BOTTLES    = Water Bottle, Flask, Tumbler
category_group.PAPER      = Notebook, Notepad, Sketchbook, Textbook
category_group.STATIONERY = Pen, Marker, Pencil Box, Ruler
category_group.ELECTRONIC = Charger, USB Cable, Power Bank, Earphones, Pen Drive
